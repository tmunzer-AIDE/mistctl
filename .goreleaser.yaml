# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for mistctl.
#
# Releases run on the maintainer's Mac (make release), which signs and
# notarizes the macOS binaries with the local keychain.
# Signing and package publishing are opt-in: each step only runs when its
# secrets are present, so a fork or a first release works without them.
# See RELEASING.md for the secrets and one-time setup.
version: 2

project_name: mistctl

before:
  hooks:
    # No `go mod tidy` (it can change what is built) and no tests here: this
    # runs with the signing and publishing secrets in the environment, so
    # nothing that executes dependency code belongs in it. Tests run in
    # their own job of the release workflow.
    - go mod verify
    - ./scripts/completions.sh --if-missing

builds:
  - id: mistctl
    main: ./cmd/mistctl
    binary: mistctl
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/tmunzer-AIDE/mistctl/internal/cli.Version={{ .Version }}
      - -X github.com/tmunzer-AIDE/mistctl/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/tmunzer-AIDE/mistctl/internal/cli.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        # Signs and notarizes macOS binaries with the local keychain when
        # CODESIGN_IDENTITY is set (releases run on the maintainer's Mac).
        - cmd: ./scripts/sign-macos.sh "{{ .Path }}" "{{ .Target }}"
          output: true
        # Authenticode-signs Windows binaries when WINDOWS_SIGN_* is set.
        - cmd: ./scripts/sign-windows.sh "{{ .Path }}" "{{ .Target }}"
          output: true

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

nfpms:
  - id: packages
    package_name: mistctl
    vendor: mistctl
    homepage: https://github.com/tmunzer-AIDE/mistctl
    maintainer: mistctl maintainers
    description: Read-only, kubectl-style command line client for the Juniper Mist API.
    license: MIT
    formats: [deb, rpm, apk]
    contents:
      - src: ./completions/mistctl.bash
        dst: /usr/share/bash-completion/completions/mistctl
        file_info: { mode: 0644 }
      - src: ./completions/mistctl.zsh
        dst: /usr/share/zsh/vendor-completions/_mistctl
        file_info: { mode: 0644 }
      - src: ./completions/mistctl.fish
        dst: /usr/share/fish/vendor_completions.d/mistctl.fish
        file_info: { mode: 0644 }

homebrew_casks:
  - name: mistctl
    repository:
      owner: tmunzer-AIDE
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/tmunzer-AIDE/mistctl
    description: Read-only, kubectl-style command line client for the Juniper Mist API
    license: MIT
    # Homebrew disables casks that fail Gatekeeper, so only publish the cask
    # when the macOS binaries are signed and notarized.
    skip_upload: '{{ if and (isEnvSet "TAP_GITHUB_TOKEN") (ne (envOrDefault "CODESIGN_IDENTITY" "") "") }}false{{ else }}true{{ end }}'
    completions:
      bash: completions/mistctl.bash
      zsh: completions/mistctl.zsh
      fish: completions/mistctl.fish

scoops:
  - name: mistctl
    repository:
      owner: tmunzer-AIDE
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/tmunzer-AIDE/mistctl
    description: Read-only, kubectl-style command line client for the Juniper Mist API
    license: MIT
    skip_upload: '{{ if isEnvSet "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

winget:
  - name: mistctl
    publisher: tmunzer-AIDE
    short_description: Read-only command line client for the Juniper Mist API
    license: MIT
    homepage: https://github.com/tmunzer-AIDE/mistctl
    publisher_url: https://github.com/tmunzer-AIDE
    package_identifier: tmunzer-AIDE.mistctl
    skip_upload: '{{ if isEnvSet "WINGET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: tmunzer-AIDE
      name: winget-pkgs
      branch: "mistctl-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      # Releases are drafts, so their download URLs only work once published.
      # GoReleaser pushes the manifest branch to the fork; open the PR to
      # microsoft/winget-pkgs by hand after publishing (see RELEASING.md).
      pull_request:
        enabled: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  prerelease: auto
