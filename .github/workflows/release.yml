name: release

# Releases normally run on the maintainer's Mac (`make release`), which signs
# and notarizes the macOS binaries with the local keychain. This workflow is a
# manual fallback for an existing tag: it builds and publishes everything
# except a signed macOS build, so the Homebrew cask is skipped.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  # Tests run dependency code, so they get their own job with no secret and
  # a read-only token: nothing they execute can reach the signing keys.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestation of the release checksums.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install osslsigncode (Windows signing)
        run: sudo apt-get update && sudo apt-get install -y osslsigncode
      # `go run` executes dependency code: do it here, before the step that
      # holds the secrets (GoReleaser then reuses these files).
      - name: Generate shell completions
        run: ./scripts/completions.sh
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.20.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap + Scoop bucket (optional)
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # winget-pkgs fork (optional)
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          # Windows Authenticode signing (optional)
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
      # Signs the checksums (and through them every artifact) with the
      # workflow identity: verify with `gh attestation verify <file> -R
      # tmunzer-AIDE/mistctl`. Attestations need a public repository (or a
      # paid plan), so a failure here does not fail the release.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-checksums: dist/checksums.txt
